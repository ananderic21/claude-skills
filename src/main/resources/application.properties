spring.application.name=claude-skills

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/javadb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=28800

# Gmail SMTP for transactional email (password reset). Gmail requires an
# "App Password" (Google Account -> Security -> 2-Step Verification -> App
# passwords), NOT your normal login password and NOT an Apple/Keychain-style
# "xxxxxx-xxxxxx-xxxxxx" suggestion. A real Google App Password is 16 lowercase
# letters shown as 4 groups of 4 (e.g. "abcd efgh ijkl mnop") — enter it with
# the spaces removed. It must be generated on the SAME account set as
# spring.mail.username below, or Gmail replies "535-5.7.8 BadCredentials".
# Provide these via env vars so no credential is committed; if unset, the app
# still boots and email sends fail (logged to logs/error.log) not at startup.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:andxyz332@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pehke7-ferSos-wojxav}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset: the "From" address, where the reset link points (frontend),
# and how long a link stays valid before it expires.
app.mail.from=${MAIL_USERNAME:no-reply@taskdashboard.local}
app.frontend.base-url=http://localhost:5173
app.password-reset.expiry-hours=24

app.logging.slow-threshold-ms=500

# App-package log verbosity. Set to DEBUG or TRACE to capture detailed traces
# (written to logs/application.log). Override at runtime with -Dapp.logging.level=DEBUG.
app.logging.level=INFO

# Profile picture: enforced in ProfileServiceImpl (2MB)
# Task import: up to 100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

app.uploads.dir=uploads