spring.application.name=claude-skills

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/javadb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=28800

app.logging.slow-threshold-ms=500

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.uploads.dir=uploads